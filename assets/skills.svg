<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 452" width="1200" height="452" role="img" aria-label="Core proficiency">
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#070f1c"/>
      <stop offset="50%"  stop-color="#0d1c2d"/>
      <stop offset="100%" stop-color="#070f1c"/>
