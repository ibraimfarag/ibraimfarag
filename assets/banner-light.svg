<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-labelledby="t1 d1">
  <title id="t1">Ibrahim Ahmed</title>
  <desc id="d1">Animated banner: Ibrahim Ahmed, Full-Stack Web Developer</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#f7fbfd"/>
      <stop offset="45%"  stop-color="#e8f6f6"/>
      <stop offset="100%" stop-color="#f7fbfd"/>
    </linearGradient>

    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#0f766e"/>
      <stop offset="55%"  stop-color="#0e7490"/>
      <stop offset="100%" stop-color="#0369a1"/>
      <animate attributeName="x1" values="-0.6;0.3;-0.6" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0.4;1.3;0.4" dur="6s" repeatCount="indefinite"/>
    </linearGradient>

    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#0d9488" stop-opacity="0"/>
      <stop offset="20%"  stop-color="#0d9488" stop-opacity="0.85"/>
      <stop offset="80%"  stop-color="#0284c7" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0"/>
    </linearGradient>

    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" fill="none" stroke="#0d9488" stroke-opacity="0.09" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="360" fill="url(#bg)"/>
  <rect width="1200" height="360" fill="url(#grid)"/>

  <circle cx="150" cy="95" r="105" fill="#0d9488" opacity="0.08">
    <animate attributeName="cy" values="95;140;95" dur="8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1055" cy="265" r="135" fill="#0284c7" opacity="0.08">
    <animate attributeName="cy" values="265;205;265" dur="11s" repeatCount="indefinite"/>
  </circle>
  <circle cx="915" cy="70" r="62" fill="#7c3aed" opacity="0.07">
    <animate attributeName="cx" values="915;958;915" dur="7s" repeatCount="indefinite"/>
  </circle>

  <text x="52" y="318" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="160" font-weight="700" fill="#0d9488" opacity="0.10">&lt;/&gt;</text>
  <text x="1005" y="212" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="160" font-weight="700" fill="#0284c7" opacity="0.08">{ }</text>

  <text x="600" y="158" text-anchor="middle"
        font-family="Segoe UI, -apple-system, Helvetica Neue, Arial, sans-serif"
        font-size="84" font-weight="800" letter-spacing="5"
        fill="url(#accent)">IBRAHIM AHMED</text>

  <text x="600" y="205" text-anchor="middle"
        font-family="Segoe UI, -apple-system, Helvetica Neue, Arial, sans-serif"
        font-size="22" font-weight="600" letter-spacing="9"
        fill="#475569">FULL&#8209;STACK WEB DEVELOPER</text>

  <rect x="330" y="228" width="540" height="2" rx="1" fill="url(#rule)"/>

  <g font-family="Segoe UI, -apple-system, Helvetica Neue, Arial, sans-serif"
     font-size="14" font-weight="600" letter-spacing="1.2">

    <g>
      <rect x="206" y="258" width="210" height="40" rx="20" fill="#0d9488" fill-opacity="0.08" stroke="#0d9488" stroke-opacity="0.45"/>
      <text x="311" y="283" text-anchor="middle" fill="#0f766e">6+ YEARS EXPERIENCE</text>
    </g>
    <g>
      <rect x="428" y="258" width="112" height="40" rx="20" fill="#0d9488" fill-opacity="0.08" stroke="#0d9488" stroke-opacity="0.45"/>
      <text x="484" y="283" text-anchor="middle" fill="#0f766e">LARAVEL</text>
    </g>
    <g>
      <rect x="552" y="258" width="100" height="40" rx="20" fill="#0d9488" fill-opacity="0.08" stroke="#0d9488" stroke-opacity="0.45"/>
      <text x="602" y="283" text-anchor="middle" fill="#0f766e">REACT</text>
    </g>
    <g>
      <rect x="664" y="258" width="112" height="40" rx="20" fill="#0d9488" fill-opacity="0.08" stroke="#0d9488" stroke-opacity="0.45"/>
      <text x="720" y="283" text-anchor="middle" fill="#0f766e">NODE.JS</text>
    </g>
    <g>
      <rect x="788" y="258" width="112" height="40" rx="20" fill="#0d9488" fill-opacity="0.08" stroke="#0d9488" stroke-opacity="0.45"/>
      <text x="844" y="283" text-anchor="middle" fill="#0f766e">FLUTTER</text>
    </g>
    <g>
      <rect x="912" y="258" width="82" height="40" rx="20" fill="#0d9488" fill-opacity="0.08" stroke="#0d9488" stroke-opacity="0.45"/>
      <text x="953" y="283" text-anchor="middle" fill="#0f766e">RUST</text>
    </g>

  </g>
</svg>
