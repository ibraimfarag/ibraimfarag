<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 330" width="1200" height="330" role="img" aria-label="Terminal">
  <defs>
    <linearGradient id="tcard" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#060d18"/>
      <stop offset="50%"  stop-color="#0b1826"/>
      <stop offset="100%" stop-color="#060d18"/>
    </linearGradient>
    <clipPath id="roundTop">
      <rect x="3" y="3" width="1194" height="324" rx="20"/>
    </clipPath>
  </defs>

  <rect x="3" y="3" width="1194" height="324" rx="20" fill="url(#tcard)"/>
  <rect x="3" y="3" width="1194" height="324" rx="20" fill="none" stroke="#7fffd4" stroke-opacity="0.22" stroke-width="1.5"/>

  <g clip-path="url(#roundTop)">
    <rect x="3" y="3" width="1194" height="46" fill="#7fffd4" fill-opacity="0.045"/>
    <rect x="3" y="48" width="1194" height="1" fill="#7fffd4" fill-opacity="0.16"/>
  </g>

  <g>
    <circle cx="30" cy="27" r="7" fill="#ff5f57"/>
    <circle cx="54" cy="27" r="7" fill="#febc2e"/>
    <circle cx="78" cy="27" r="7" fill="#28c840"/>
  </g>

  <text x="600" y="32" text-anchor="middle" font-size="13" letter-spacing="1" fill="#64748b" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">ibrahim@dev: ~</text>

  <text x="52" y="84" font-size="15" fill="#e2e8f0" opacity="0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="0.35s" fill="freeze"/><tspan fill="#7fffd4">$</tspan> <tspan fill="#e2e8f0">whoami</tspan>
  </text>
  <text x="52" y="114" font-size="15" fill="#e2e8f0" opacity="0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="0.85s" fill="freeze"/><tspan fill="#94a3b8">ibrahim ahmed &#183; full-stack web developer</tspan>
  </text>
  <text x="52" y="144" font-size="15" fill="#e2e8f0" opacity="0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="1.35s" fill="freeze"/><tspan fill="#7fffd4">$</tspan> <tspan fill="#e2e8f0">cat stack.txt</tspan>
  </text>
  <text x="52" y="174" font-size="15" fill="#e2e8f0" opacity="0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="1.85s" fill="freeze"/><tspan fill="#5eead4">php &#183; laravel &#183; javascript &#183; node.js &#183; vue &#183; react &#183; angular</tspan>
  </text>
  <text x="52" y="204" font-size="15" fill="#e2e8f0" opacity="0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="2.35s" fill="freeze"/><tspan fill="#5eead4">flutter &#183; dart &#183; python &#183; rust &#183; mysql &#183; postgres &#183; mongodb</tspan>
  </text>
  <text x="52" y="234" font-size="15" fill="#e2e8f0" opacity="0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="2.85s" fill="freeze"/><tspan fill="#7fffd4">$</tspan> <tspan fill="#e2e8f0">npm run build</tspan>
  </text>
  <text x="52" y="264" font-size="15" fill="#e2e8f0" opacity="0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="3.35s" fill="freeze"/><tspan fill="#34d399">&#10004; build complete in 2.1s &#8212; 0 errors, 0 warnings</tspan>
  </text>
  <text x="52" y="294" font-size="15" fill="#e2e8f0" opacity="0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="3.85s" fill="freeze"/><tspan fill="#7fffd4">$</tspan>
  </text>

  <rect x="64" y="277" width="9" height="17" fill="#7fffd4" opacity="0.9">
    <animate attributeName="opacity" values="0.9;0;0.9" dur="1.1s" repeatCount="indefinite"/>
  </rect>
</svg>
