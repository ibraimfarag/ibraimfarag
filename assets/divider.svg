<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 60" width="1200" height="60" role="presentation">
  <defs>
    <linearGradient id="dv" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#7fffd4" stop-opacity="0"/>
      <stop offset="25%"  stop-color="#7fffd4" stop-opacity="0.85"/>
      <stop offset="75%"  stop-color="#7dd3fc" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#7dd3fc" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <path d="M0 30 C 150 4, 300 56, 450 30 S 750 4, 900 30 S 1150 56, 1200 30"
        fill="none" stroke="url(#dv)" stroke-width="2.4" stroke-linecap="round"
        stroke-dasharray="14 10">
    <animate attributeName="stroke-dashoffset" from="0" to="-240" dur="9s" repeatCount="indefinite"/>
  </path>

  <g transform="translate(600,30)">
    <rect x="-7" y="-7" width="14" height="14" rx="3"
          fill="none" stroke="#7fffd4" stroke-width="2" transform="rotate(45)">
      <animateTransform attributeName="transform" type="rotate"
                        values="45;225;45" dur="12s" repeatCount="indefinite"/>
    </rect>
    <rect x="-3" y="-3" width="6" height="6" rx="1.5" fill="#7fffd4">
      <animate attributeName="opacity" values="0.45;1;0.45" dur="2.6s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
