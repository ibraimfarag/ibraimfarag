<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 190" width="1200" height="190" role="img" aria-label="Thanks for visiting">
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#070e1a"/>
      <stop offset="50%"  stop-color="#102839"/>
      <stop offset="100%" stop-color="#070e1a"/>
    </linearGradient>
    <linearGradient id="ft" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#7fffd4"/>
      <stop offset="100%" stop-color="#7dd3fc"/>
      <animate attributeName="x1" values="-0.6;0.3;-0.6" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0.4;1.3;0.4" dur="7s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#7fffd4" stop-opacity="0.6"/>
      <stop offset="50%"  stop-color="#7dd3fc" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#7dd3fc" stop-opacity="0.6"/>
    </linearGradient>
  </defs>

  <rect x="14" y="14" width="1172" height="162" rx="26" fill="url(#card)"/>
  <rect x="14" y="14" width="1172" height="162" rx="26" fill="none" stroke="url(#edge)" stroke-width="1.5"/>

  <text x="600" y="86" text-anchor="middle"
        font-family="Segoe UI, -apple-system, Helvetica Neue, Arial, sans-serif"
        font-size="40" font-weight="800" letter-spacing="6"
        fill="url(#ft)">THANKS FOR VISITING</text>

  <text x="600" y="122" text-anchor="middle"
        font-family="Segoe UI, -apple-system, Helvetica Neue, Arial, sans-serif"
        font-size="17" font-weight="500" letter-spacing="4"
        fill="#94a3b8">LET&#8217;S BUILD SOMETHING GREAT TOGETHER</text>

  <g fill="#7fffd4">
    <circle cx="572" cy="150" r="4">
      <animate attributeName="opacity" values="0.25;1;0.25" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="600" cy="150" r="4">
      <animate attributeName="opacity" values="0.25;1;0.25" dur="2.4s" begin="0.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="628" cy="150" r="4">
      <animate attributeName="opacity" values="0.25;1;0.25" dur="2.4s" begin="0.8s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
